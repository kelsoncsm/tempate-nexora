<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Nexora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page" data-page="login">

  <main class="auth-card" role="main">
    <div class="auth-brand">
      <span class="brand-mark">N</span>
      <div class="t"><strong>NEXORA</strong><span>Plataforma MultiNicho</span></div>
    </div>

    <div class="auth-heading">
      <h1>Bem-vindo de volta!</h1>
      <p>Entre para acessar o painel da sua empresa.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <div class="input-icon-wrap">
          <i class="fa-regular fa-envelope"></i>
          <input class="form-control" type="email" id="email" placeholder="voce@empresa.com.br" value="kelson@clinicasorriso.com.br" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input class="form-control" type="password" id="senha" placeholder="••••••••••••" value="nexora123456" required>
          <button type="button" class="toggle-visibility" aria-label="Mostrar senha" data-action="toggle-password"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>

      <div class="auth-options">
        <label class="checkbox-row"><input type="checkbox"> Lembrar-me</label>
        <a href="#" class="btn-link" id="linkEsqueci">Esqueci minha senha</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <div class="auth-foot">Ainda não tem conta? <a href="pages/cadastro.html">Criar agora</a></div>
    <p class="auth-note">Plataforma MultiNicho · dados isolados por empresa</p>
  </main>

<script src="assets/js/app.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = 'pages/dashboard.html';
  });
  document.getElementById('linkEsqueci').addEventListener('click', function (e) {
    e.preventDefault();
    this.textContent = 'Link enviado para o seu e-mail (simulação)';
  });
</script>
</body>
</html>
